name: IAM Check Push
on:
  push:
    branches:
      - main
env:
  AWS_REGION: ap-south-1
jobs:
  iam-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Dump IAM
        run: |
          aws iam list-attached-user-policies --user-name github-actions-devsecops > attached.json 2>&1 || true
          aws iam list-user-policies --user-name github-actions-devsecops > inline.json 2>&1 || true
          
          # For each attached policy, get its content
          if grep -q "AttachedPolicies" attached.json; then
            for arn in $(jq -r '.AttachedPolicies[].PolicyArn' attached.json); do
              version=$(aws iam get-policy --policy-arn "$arn" | jq -r '.Policy.DefaultVersionId')
              aws iam get-policy-version --policy-arn "$arn" --version-id "$version" > "policy_attached_${version}.json" 2>&1 || true
            done
          fi
          
          # For each inline policy, get its content
          if grep -q "PolicyNames" inline.json; then
            for pol in $(jq -r '.PolicyNames[]' inline.json); do
              aws iam get-user-policy --user-name github-actions-devsecops --policy-name "$pol" > "policy_inline_${pol}.json" 2>&1 || true
            done
          fi
          
          mkdir -p iam_output
          cp *.json iam_output/ || true
          
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add iam_output/
          git commit -m "Update IAM output" || true
          git push
