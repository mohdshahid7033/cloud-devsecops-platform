                  docker cp devsecops-nginx:/etc/nginx/nginx.conf /home/ec2-user/nginx-conf/backup/nginx.conf.orig 2>/dev/null || true
                  docker cp devsecops-nginx:/etc/nginx/conf.d/upstream.conf /home/ec2-user/nginx-conf/backup/upstream.conf.orig 2>/dev/null || true

