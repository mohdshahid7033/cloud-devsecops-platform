                          cp /home/ec2-user/nginx-conf/backup/nginx.conf.orig /home/ec2-user/nginx-conf/nginx.conf 2>/dev/null || true
                      fi
                      if [ -f /home/ec2-user/nginx-conf/backup/upstream.conf.orig ]; then
                          cp /home/ec2-user/nginx-conf/backup/upstream.conf.orig /home/ec2-user/nginx-conf/upstream.conf 2>/dev/null || true
                      else
