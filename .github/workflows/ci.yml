                  -v devsecops-grafana-data:/var/lib/grafana \
                  -v /home/ec2-user/grafana/provisioning:/etc/grafana/provisioning:ro \
                  -v /home/ec2-user/grafana/dashboards:/var/lib/grafana/dashboards:ro grafana/grafana:latest
          fi

          echo "=== 7. DEPLOYMENT FINISHED ON REMOTE HOST ==="
          EOF

          sed -i "s|__DEPLOY_IMAGE__|$DEPLOY_IMAGE|g" remote_wrapper.sh
          sed -i "s|__AWS_ACCOUNT_ID__|$AWS_ACCOUNT_ID|g" remote_wrapper.sh
          sed -i "s|__DEPLOY_SCRIPT_GZ_B64__|$DEPLOY_SCRIPT_GZ_B64|g" remote_wrapper.sh
          sed -i "s|__DASHBOARD_GZ_B64__|$DASHBOARD_GZ_B64|g" remote_wrapper.sh

          jq -R -s --arg inst "$TARGET_INSTANCE_ID" '{
            "InstanceIds": [$inst],
            "DocumentName": "AWS-RunShellScript",
            "Parameters": {
              "commands": [.]
            }
          }' remote_wrapper.sh > ssm_payload.json

          COMMAND_ID=$(aws ssm send-command \
            --cli-input-json file://ssm_payload.json \
            --region ap-south-1 \
            --query "Command.CommandId" \
            --output text)

          if [ -z "$COMMAND_ID" ] || [ "$COMMAND_ID" = "None" ]; then
            echo "Failed to dispatch SSM command: CommandId was empty or None" >&2
            exit 1
          fi

          echo "Dispatched SSM Command ID: $COMMAND_ID on instance $TARGET_INSTANCE_ID"

          MAX_WAIT=180
          START_TIME=$(date +%s)
          STATUS=""
          LOOKUP_ERRORS=0

          while [ $(( $(date +%s) - START_TIME )) -lt $MAX_WAIT ]; do
            STATUS=$(timeout 15 aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$TARGET_INSTANCE_ID" \
              --region ap-south-1 \
              --query "Status" \
              --output text 2>/dev/null) || STATUS=""

            ELAPSED=$(( $(date +%s) - START_TIME ))
            echo "SSM Status (${ELAPSED}s elapsed): ${STATUS:-Waiting...}"

            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              break
            fi
            sleep 5
          done

          echo "=== Retrieving Final SSM Output ==="
          INVOCATION_JSON=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$TARGET_INSTANCE_ID" \
            --region ap-south-1 \
            --output json 2>/dev/null || true)

          if [ -n "$INVOCATION_JSON" ]; then
            echo "=== SSM Standard Output ==="
            echo "$INVOCATION_JSON" | jq -r '.StandardOutputContent // empty'
            STDERR=$(echo "$INVOCATION_JSON" | jq -r '.StandardErrorContent // empty')
            if [ -n "$STDERR" ]; then
              echo "=== SSM Standard Error ==="
              echo "$STDERR"
            fi
          fi

          if [ "$STATUS" != "Success" ]; then
            echo "ERROR: SSM Command failed with final status: $STATUS" >&2
            exit 1
          fi
          echo "SSM Blue/Green Deployment successfully executed."

  # ============================================================================
  # 4. VERIFY PRODUCTION (Independent external health check on public endpoint)
  # ============================================================================
  verify-production:
    name: Verify Production Health
    runs-on: ubuntu-latest
    needs: [deploy-blue-green, publish-ecr]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_to_production == true

    steps:
      - name: Configure AWS credentials (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Resolve target EC2 instance and public IP
        id: resolve_ec2
        run: |
          echo "Resolving running EC2 instance with tags Project=devsecops-platform, Environment=production..."
          INSTANCES=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=devsecops-platform" \
                      "Name=tag:Environment,Values=production" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text \
            --region ap-south-1)

          NUM_INSTANCES=$(echo "$INSTANCES" | wc -w)
          if [ "$NUM_INSTANCES" -ne 1 ]; then
            echo "ERROR: Expected exactly 1 running instance for verification, found $NUM_INSTANCES ($INSTANCES). Aborting." >&2
            exit 1
          fi

          INSTANCE_ID=$(echo "$INSTANCES" | tr -d '[:space:]')
          echo "Resolved unique target EC2 Instance ID: $INSTANCE_ID"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text \
            --region ap-south-1)

          if [ -z "$PUBLIC_IP" ] || [ "$PUBLIC_IP" = "None" ]; then
            echo "ERROR: Unable to resolve public IP for production EC2 instance ($INSTANCE_ID)." >&2
            exit 1
          fi

          echo "Target Public IP: $PUBLIC_IP"
          echo "public_ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"

      - name: Verify production endpoint health
        id: verify_health
        env:
          PUBLIC_IP: ${{ steps.resolve_ec2.outputs.public_ip }}
        run: |
          HEALTH_URL="http://${PUBLIC_IP}/health"
          echo "Verifying production endpoint: $HEALTH_URL"

          MAX_ATTEMPTS=12
          ATTEMPT=0
          HEALTHY=false

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            RESP=$(curl -s --max-time 10 "$HEALTH_URL" || echo '{"error": "curl failed"}')

            STATUS=$(echo "$RESP" | jq -r '.status // empty')
            DB_CONN=$(echo "$RESP" | jq -r '.database.connected // empty')
            DB_MODE=$(echo "$RESP" | jq -r '.database.mode // empty')

            echo "Attempt $ATTEMPT: status=$STATUS, db_connected=$DB_CONN, mode=$DB_MODE"

            if [ "$STATUS" = "healthy" ] && [ "$DB_CONN" = "true" ] && [ "$DB_MODE" = "live_mysql" ]; then
              HEALTHY=true
              echo "Production health check passed successfully!"
              break
            fi
            sleep 5
          done

          if [ "$HEALTHY" != "true" ]; then
            echo "ERROR: Production health check failed to confirm healthy status and live database connection." >&2
            exit 1
          fi

      - name: Verify running container image digest matches published ECR digest
        id: verify_digest
        env:
          TARGET_INSTANCE_ID: ${{ steps.resolve_ec2.outputs.instance_id }}
          EXPECTED_DIGEST: ${{ needs.publish-ecr.outputs.image_digest }}
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID || '850252650249' }}.dkr.ecr.ap-south-1.amazonaws.com
          ECR_REPOSITORY: devsecops-platform
        run: |
          echo "Verifying running container image digest matches published ECR digest: $EXPECTED_DIGEST"
          if [ -z "$EXPECTED_DIGEST" ] || [ "$EXPECTED_DIGEST" = "null" ]; then
            echo "ERROR: Expected ECR image digest is missing from publication job output!" >&2
            exit 1
          fi

          if ! echo "$EXPECTED_DIGEST" | grep -E -q '^sha256:[a-f0-9]{64}$'; then
            echo "ERROR: Expected ECR image digest format is invalid: '$EXPECTED_DIGEST' (must match ^sha256:[a-f0-9]{64}$)" >&2
            exit 1
          fi

          EXPECTED_REF="${ECR_REGISTRY}/${ECR_REPOSITORY}@${EXPECTED_DIGEST}"
          echo "Expected full image reference: $EXPECTED_REF"

          DIGEST_PAYLOAD=$(jq -n \
            --arg inst "$TARGET_INSTANCE_ID" \
            --arg exp_ref "$EXPECTED_REF" \
            --arg exp_dig "$EXPECTED_DIGEST" '{
            "InstanceIds": [$inst],
            "DocumentName": "AWS-RunShellScript",
            "Parameters": {
              "commands": [
                ("EXPECTED_REF=\"" + $exp_ref + "\""),
                ("EXPECTED_DIGEST=\"" + $exp_dig + "\""),
                "if ! echo \"$EXPECTED_DIGEST\" | grep -E -q \"^sha256:[a-f0-9]{64}$\"; then echo \"ERROR: Invalid digest format: $EXPECTED_DIGEST\" >&2; exit 1; fi",
                "if ! docker ps --filter \"name=^/devsecops-nginx$\" --filter \"status=running\" --format \"{{.Names}}\" | grep -q \"^devsecops-nginx$\"; then echo \"ERROR: Reverse proxy container devsecops-nginx is not running!\" >&2; exit 1; fi",
                "UPSTREAM_CONF=$(docker exec devsecops-nginx cat /etc/nginx/conf.d/upstream.conf 2>/dev/null || true)",
                "if [ -z \"$UPSTREAM_CONF\" ]; then echo \"ERROR: Failed to read /etc/nginx/conf.d/upstream.conf from running devsecops-nginx!\" >&2; exit 1; fi",
                "CLEAN_UPSTREAM=$(echo \"$UPSTREAM_CONF\" | sed -e \"s/#.*//\")",
                "ONE_LINE=$(echo \"$CLEAN_UPSTREAM\" | tr \"\\n\" \" \" | tr -s \" \")",
                "TOTAL_BLOCK_DEFS=$(echo \"$ONE_LINE\" | grep -o \"upstream[[:space:]]\\+app_backend[[:space:]]*{\" | wc -l)",
                "CLOSED_BLOCKS=$(echo \"$ONE_LINE\" | grep -o \"upstream[[:space:]]\\+app_backend[[:space:]]*{[^{}]*}\" | wc -l)",
                "if [ \"$TOTAL_BLOCK_DEFS\" -ne 1 ] || [ \"$CLOSED_BLOCKS\" -ne 1 ]; then echo \"ERROR: Malformed, unclosed, or ambiguous upstream app_backend block!\" >&2; exit 1; fi",
                "BLOCK_BODY=$(echo \"$ONE_LINE\" | sed -e \"s/.*upstream[[:space:]]\\+app_backend[[:space:]]*{//\" -e \"s/}.*//\")",
                "TRAILING=$(echo \"$BLOCK_BODY\" | sed -e \"s/.*;//\" | tr -d \"[:space:]\")",
                "if [ -n \"$TRAILING\" ]; then echo \"ERROR: Malformed upstream app_backend block: unterminated statement (missing semicolon)!\" >&2; exit 1; fi",
                "DIRECTIVES=$(echo \"$BLOCK_BODY\" | tr \";\" \"\\n\" | sed -e \"s/^[[:space:]]*//\" -e \"s/[[:space:]]*$//\" | grep -v \"^$\" || true)",
                "if [ -z \"$DIRECTIVES\" ]; then echo \"ERROR: No directives found in app_backend upstream block!\" >&2; exit 1; fi",
                "DIRECTIVE_COUNT=$(echo \"$DIRECTIVES\" | wc -l)",
                "if [ \"$DIRECTIVE_COUNT\" -ne 1 ]; then echo \"ERROR: Expected exactly 1 directive in app_backend upstream, found $DIRECTIVE_COUNT:\" >&2; echo \"$DIRECTIVES\" >&2; exit 1; fi",
                "if ! echo \"$DIRECTIVES\" | grep -E -q \"^server[[:space:]]+(devsecops-app-blue|devsecops-app-green|devsecops-app):5000$\"; then echo \"ERROR: Directive does not match exact supported syntax 'server <authorized-host>:5000' with no trailing parameters: '$DIRECTIVES'\" >&2; exit 1; fi",
                "ACTIVE_CONT=$(echo \"$DIRECTIVES\" | sed -e \"s/^server[[:space:]]\\+//\" | cut -d: -f1)",
                "echo \"Authoritatively verified active production container from running Nginx: $ACTIVE_CONT\"",
                "if ! docker ps --filter \"name=^/${ACTIVE_CONT}$\" --filter \"status=running\" --format \"{{.Names}}\" | grep -q \"^${ACTIVE_CONT}$\"; then echo \"ERROR: Active container \\\"$ACTIVE_CONT\\\" is not running in Docker!\" >&2; exit 1; fi",
                "REPO_DIGESTS=$(docker inspect \"$ACTIVE_CONT\" --format \"{{range .RepoDigests}}{{.}} {{end}}\")",
                "echo \"Running Container: $ACTIVE_CONT\"",
                "echo \"Image RepoDigests: $REPO_DIGESTS\"",
                "if [ -z \"$REPO_DIGESTS\" ] || [ \"$REPO_DIGESTS\" = \" \" ]; then echo \"ERROR: Container $ACTIVE_CONT has no RepoDigests!\" >&2; exit 1; fi",
                "MATCH=false",
                "for ref in $REPO_DIGESTS; do if [ \"$ref\" = \"$EXPECTED_REF\" ]; then MATCH=true; break; fi; done",
                "if [ \"$MATCH\" != \"true\" ]; then echo \"ERROR: Exact image reference mismatch! Expected: $EXPECTED_REF, found: $REPO_DIGESTS\" >&2; exit 1; fi",
                "echo \"Exact image reference verified successfully on running container: $EXPECTED_REF\""
              ]
            }
          }')

          COMMAND_ID=$(aws ssm send-command \
            --cli-input-json "$DIGEST_PAYLOAD" \
            --region ap-south-1 \
            --query "Command.CommandId" \
            --output text)

          if [ -z "$COMMAND_ID" ] || [ "$COMMAND_ID" = "None" ]; then
            echo "ERROR: Failed to dispatch SSM digest verification command" >&2
            exit 1
          fi

          MAX_WAIT=60
          START_TIME=$(date +%s)
          STATUS=""

          while [ $(( $(date +%s) - START_TIME )) -lt $MAX_WAIT ]; do
            STATUS=$(timeout 15 aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$TARGET_INSTANCE_ID" \
              --region ap-south-1 \
              --query "Status" \
              --output text 2>/dev/null) || STATUS=""

            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ]; then
              break
            fi
            sleep 3
          done

          if [ "$STATUS" != "Success" ]; then
            echo "ERROR: SSM container image digest verification failed with status: $STATUS" >&2
            INVOCATION_ERR=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$TARGET_INSTANCE_ID" \
              --region ap-south-1 \
              --output json 2>/dev/null || true)
            echo "$INVOCATION_ERR" | jq -r '.StandardErrorContent // empty'
            exit 1
          fi
          echo "Production running container image digest authoritatively verified against ECR publication."

      - name: Trigger automated rollback on external verification failure
        if: failure() && (steps.verify_health.outcome == 'failure' || steps.verify_digest.outcome == 'failure')
        env:
          TARGET_INSTANCE_ID: ${{ steps.resolve_ec2.outputs.instance_id }}
        run: |
          echo "External production verification failed! Triggering automated rollback via SSM..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$TARGET_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["/home/ec2-user/scripts/deploy_blue_green.sh --rollback"]' \
            --region ap-south-1 \
            --query "Command.CommandId" \
            --output text)

          if [ -z "$COMMAND_ID" ] || [ "$COMMAND_ID" = "None" ]; then
            echo "CRITICAL: Failed to dispatch SSM rollback command. Manual intervention required!" >&2
            exit 1
          fi

          echo "Dispatched SSM Rollback Command ID: $COMMAND_ID on instance $TARGET_INSTANCE_ID"

          MAX_WAIT=90
          START_TIME=$(date +%s)
          STATUS=""

          while [ $(( $(date +%s) - START_TIME )) -lt $MAX_WAIT ]; do
            STATUS=$(timeout 15 aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$TARGET_INSTANCE_ID" \
              --region ap-south-1 \
              --query "Status" \
              --output text 2>/dev/null) || STATUS=""

            ELAPSED=$(( $(date +%s) - START_TIME ))
            echo "Rollback SSM Status (${ELAPSED}s elapsed): ${STATUS:-Waiting...}"

            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              break
            fi
            sleep 5
          done

          INVOCATION_JSON=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$TARGET_INSTANCE_ID" \
            --region ap-south-1 \
            --output json 2>/dev/null || true)

          if [ -n "$INVOCATION_JSON" ]; then
            echo "=== Rollback SSM Output ==="
            echo "$INVOCATION_JSON" | jq -r '.StandardOutputContent // empty'
            STDERR=$(echo "$INVOCATION_JSON" | jq -r '.StandardErrorContent // empty')
            if [ -n "$STDERR" ]; then
              echo "=== Rollback SSM Error ==="
              echo "$STDERR"
            fi
          fi

          if [ "$STATUS" = "Success" ]; then
            echo "Automated rollback succeeded on production EC2: previous slot restored and verified."
            echo "However, the candidate deployment failed external verification and was rejected."
            exit 1
          else
            echo "CRITICAL: Automated rollback failed with status: ${STATUS:-Unknown}!" >&2
            echo "CRITICAL: MANUAL INTERVENTION REQUIRED IMMEDIATELY!" >&2
            exit 1
          fi

      - name: Finalize successful production deployment
        if: success()
        env:
          TARGET_INSTANCE_ID: ${{ steps.resolve_ec2.outputs.instance_id }}
        run: |
          echo "External verification passed. Finalizing deployment state on production instance..."
          aws ssm send-command \
            --instance-ids "$TARGET_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["/home/ec2-user/scripts/deploy_blue_green.sh --mark-verified"]' \
            --region ap-south-1 >/dev/null 2>&1 || true
          echo "Production deployment and verification completed successfully!"
