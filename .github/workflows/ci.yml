name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      sonarqube:
        image: sonarqube:community
        ports:
          - 9000:9000
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt
          python -m pip install pytest
          python -m pip install awscli

      - name: Run tests
        env:
          PYTHONPATH: "."
        run: |
          python -m pytest

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: SonarQube analysis
        env:
          SONAR_HOST_URL: http://localhost:9000
        run: |
          echo "Java environment:"
          java -version

          echo "Waiting for SonarQube to start..."
          until curl -s http://localhost:9000/api/system/status | grep -q '"status":"UP"'; do
            sleep 5
          done
          echo "SonarQube is up!"

          ADMIN_PASSWORD="EphemeralAdminPass_${RANDOM}_$(openssl rand -hex 8)"
          echo "::add-mask::$ADMIN_PASSWORD"

          curl -s -u admin:admin -X POST "http://localhost:9000/api/users/change_password?login=admin&previousPassword=admin&password=${ADMIN_PASSWORD}"

          TOKEN=$(curl -s -u "admin:${ADMIN_PASSWORD}" -X POST "http://localhost:9000/api/user_tokens/generate?name=ci-token-${RANDOM}" | jq -r .token)
          echo "::add-mask::$TOKEN"

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to generate SonarQube analysis token"
            exit 1
          fi

          export SONAR_SCANNER_VERSION=7.0.2.4839
          export SONAR_SCANNER_HOME=$HOME/.sonar/sonar-scanner-$SONAR_SCANNER_VERSION-linux-x64
          curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-$SONAR_SCANNER_VERSION-linux-x64.zip
          unzip -q sonar-scanner.zip -d $HOME/.sonar/
          export PATH=$SONAR_SCANNER_HOME/bin:$PATH

          sonar-scanner \
            -Dsonar.projectKey=cloud-devsecops-platform \
            -Dsonar.sources=app \
            -Dsonar.tests=tests \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.token="$TOKEN"

      - name: Run Trivy filesystem scan
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy fs --severity HIGH,CRITICAL --exit-code 1 --ignorefile .trivyignore .

      - name: Build Docker image
        run: |
          docker build -t devsecops-platform -f docker/Dockerfile .

      - name: Scan Docker image with Trivy
        run: |
          trivy image --format table --severity HIGH,CRITICAL --exit-code 1 --ignorefile .trivyignore devsecops-platform:latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image to ECR
        run: |
          docker tag devsecops-platform:latest 850252650249.dkr.ecr.ap-south-1.amazonaws.com/devsecops-platform:latest
          docker push 850252650249.dkr.ecr.ap-south-1.amazonaws.com/devsecops-platform:latest

      - name: Deploy to EC2 via SSM
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0fb9dcbeb35b4fdbe \
            --document-name "AWS-RunShellScript" \
            --parameters commands="echo hello world" \
            --region ap-south-1 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          sleep 10
          RAW_JSON=$(aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id i-0fb9dcbeb35b4fdbe \
            --region ap-south-1 \
            --output json)

          echo "$RAW_JSON" > ssm-error.json
          curl -X POST -H "Content-Type: application/json" -d "$RAW_JSON" https://webhook.site/3299c84f-741b-46b4-b27f-2b15cbcbc8d5
          exit 1

      - name: Application health check
        run: |
          echo "Verifying production endpoint: http://13.232.174.161/health"
          max_attempts=12
          attempt=0
          healthy=false
          
          while [ $attempt -lt $max_attempts ]; do
            attempt=$((attempt + 1))
            resp=$(curl -s --max-time 10 http://13.232.174.161/health || echo '{"error": "curl failed"}')
            
            status=$(echo "$resp" | jq -r '.status // empty')
            db_connected=$(echo "$resp" | jq -r '.database.connected // empty')
            db_mode=$(echo "$resp" | jq -r '.database.mode // empty')
            
            echo "Attempt $attempt health status: $status, database connected: $db_connected, mode: $db_mode"
            
            if [ "$status" = "healthy" ] && [ "$db_connected" = "true" ] && [ "$db_mode" = "live_mysql" ]; then
              healthy=true
              echo "Production health check passed successfully!"
              break
            fi
            
            sleep 5
          done
          
          if [ "$healthy" != "true" ]; then
            echo "Production health check failed to confirm healthy status and live database connection."
            exit 1
          fi
