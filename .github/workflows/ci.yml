          echo "=== 2. ECR AUTHENTICATION ==="
          aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin "__AWS_ACCOUNT_ID__.dkr.ecr.ap-south-1.amazonaws.com"

          echo "=== 3. ENSURING NETWORK AND DATABASE ==="
          docker network create devsecops-network 2>/dev/null || true
          docker volume create devsecops-mysql-data 2>/dev/null || true

