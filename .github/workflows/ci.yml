              if echo "$CLEAN_DUMP" | grep -E -q '(^|[[:space:];{}])proxy_pass[[:space:]]+http://devsecops-app(:[0-9]+)?/?;'; then
                  FOUND_DEVSECOPS=true
              fi
              if echo "$CLEAN_DUMP" | grep -E -q '(^|[[:space:];{}])proxy_pass[[:space:]]+http://app(:[0-9]+)?/?;'; then
                  FOUND_APP=true
              fi

              DUMP_MATCHES=0
              [ "$FOUND_BLUE" = true ] && DUMP_MATCHES=$((DUMP_MATCHES + 1))
              [ "$FOUND_GREEN" = true ] && DUMP_MATCHES=$((DUMP_MATCHES + 1))
              [ "$FOUND_DEVSECOPS" = true ] && DUMP_MATCHES=$((DUMP_MATCHES + 1))
              [ "$FOUND_APP" = true ] && DUMP_MATCHES=$((DUMP_MATCHES + 1))

              if [ "$DUMP_MATCHES" -gt 1 ]; then
                  echo "CRITICAL: Ambiguous active routes detected in Nginx configuration ($DUMP_MATCHES conflicting matches). Aborting."
                  exit 1
              elif [ "$FOUND_BLUE" = true ]; then
                  CURRENT_ROUTE="devsecops-app-blue"
              elif [ "$FOUND_GREEN" = true ]; then
                  CURRENT_ROUTE="devsecops-app-green"
              elif [ "$FOUND_DEVSECOPS" = true ]; then
                  CURRENT_ROUTE="devsecops-app"
              elif [ "$FOUND_APP" = true ]; then
                  CURRENT_ROUTE="app"
              else
                  echo "CRITICAL: Nginx is running but active production route could not be unambiguously identified. Aborting."
                  exit 1
              fi
          fi

          # Determine the active upstream target (preserve discovered route, default to blue only on fresh install)
          ACTIVE_TARGET="${CURRENT_ROUTE:-devsecops-app-blue}"
