name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      sonarqube:
        image: sonarqube:community
        ports:
          - 9000:9000
    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@v4

      - name: Check Python
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        id: install_deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt
          python -m pip install pytest
          python -m pip install awscli

      - name: Run tests
        id: run_tests
        env:
          PYTHONPATH: "."
        run: |
          python -m pytest

      - name: Set up Java
        id: setup_java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: SonarQube analysis
        id: sonarqube
        env:
          SONAR_HOST_URL: http://localhost:9000
        run: |
          echo "Java environment:"
          java -version

          echo "Waiting for SonarQube to start..."
          until curl -s http://localhost:9000/api/system/status | grep -q '"status":"UP"'; do
            sleep 5
          done
          echo "SonarQube is up!"

          ADMIN_PASSWORD="EphemeralAdminPass_${RANDOM}_$(openssl rand -hex 8)"
          echo "::add-mask::$ADMIN_PASSWORD"

          curl -s -u admin:admin -X POST "http://localhost:9000/api/users/change_password?login=admin&previousPassword=admin&password=${ADMIN_PASSWORD}"

          TOKEN=$(curl -s -u "admin:${ADMIN_PASSWORD}" -X POST "http://localhost:9000/api/user_tokens/generate?name=ci-token-${RANDOM}" | jq -r .token)
          echo "::add-mask::$TOKEN"

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to generate SonarQube analysis token"
            exit 1
          fi

          export SONAR_SCANNER_VERSION=7.0.2.4839
          export SONAR_SCANNER_HOME=$HOME/.sonar/sonar-scanner-$SONAR_SCANNER_VERSION-linux-x64
          curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-$SONAR_SCANNER_VERSION-linux-x64.zip
          unzip -q sonar-scanner.zip -d $HOME/.sonar/
          export PATH=$SONAR_SCANNER_HOME/bin:$PATH

          sonar-scanner \
            -Dsonar.projectKey=cloud-devsecops-platform \
            -Dsonar.sources=app \
            -Dsonar.tests=tests \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.token="$TOKEN"

      - name: Run Trivy filesystem scan
        id: trivy_fs
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy fs --severity HIGH,CRITICAL --exit-code 1 --ignorefile .trivyignore .

      - name: Build Docker image
        id: build_docker
        run: |
          docker build -t devsecops-platform -f docker/Dockerfile .

      - name: Scan Docker image with Trivy
        id: trivy_image
        run: |
          trivy image --format table --severity HIGH,CRITICAL --exit-code 1 --ignorefile .trivyignore devsecops-platform:latest

      - name: Configure AWS credentials
        id: configure_aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image to ECR
        id: push_ecr
        run: |
          docker tag devsecops-platform:latest 850252650249.dkr.ecr.ap-south-1.amazonaws.com/devsecops-platform:latest
          docker push 850252650249.dkr.ecr.ap-south-1.amazonaws.com/devsecops-platform:latest



      - name: Deploy to EC2 via SSM
        id: deploy_ssm
        run: |
          set +e
          cat << 'EOF' > raw-commands.sh
          #!/bin/bash
          set -euxo pipefail
          trap 'echo "REMOTE_DEPLOY_FAILED line=$LINENO command=$BASH_COMMAND"' ERR
          echo "=== STEP 1: ECR LOGIN ==="
          aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 850252650249.dkr.ecr.ap-south-1.amazonaws.com
          echo "=== STEP 2: DOCKER PULL ==="
          docker pull 850252650249.dkr.ecr.ap-south-1.amazonaws.com/devsecops-platform:latest
          docker network create devsecops-network || true
          docker volume create devsecops-mysql-data || true
          docker volume create devsecops-prometheus-data || true
          docker volume create devsecops-grafana-data || true
          echo "=== STEP 3: DATABASE PARAMETERS ==="
          DB_NAME=$(aws ssm get-parameter --name "/devsecops/db_name" --query "Parameter.Value" --output text --region ap-south-1)
          DB_USER=$(aws ssm get-parameter --name "/devsecops/db_user" --query "Parameter.Value" --output text --region ap-south-1)
          DB_PASSWORD=$(aws ssm get-parameter --name "/devsecops/db_password" --with-decryption --query "Parameter.Value" --output text --region ap-south-1)
          DB_ROOT_PASSWORD=$(aws ssm get-parameter --name "/devsecops/db_root_password" --with-decryption --query "Parameter.Value" --output text --region ap-south-1)
          echo "=== STEP 4: MYSQL ==="
          if ! docker ps --filter "name=devsecops-mysql" --filter "status=running" -q | grep -q .; then docker stop devsecops-mysql || true; docker rm devsecops-mysql || true; docker run -d --name devsecops-mysql --network devsecops-network --restart always -v devsecops-mysql-data:/var/lib/mysql -e MYSQL_DATABASE="$DB_NAME" -e MYSQL_USER="$DB_USER" -e MYSQL_PASSWORD="$DB_PASSWORD" -e MYSQL_ROOT_PASSWORD="$DB_ROOT_PASSWORD" mysql:8.0 --performance-schema=OFF --innodb-buffer-pool-size=64M --innodb-log-buffer-size=2M --max-connections=30; fi
          for i in $(seq 1 30); do if docker exec devsecops-mysql mysqladmin ping -h localhost -u root -p"$DB_ROOT_PASSWORD" --silent; then echo "MySQL is ready"; break; fi; echo "Waiting for MySQL... ($i/30)"; sleep 2; done
          echo "=== STEP 5: APPLICATION ==="
          docker stop devsecops-app || true
          docker rm devsecops-app || true
          docker run -d --name devsecops-app --network devsecops-network --restart always -e FLASK_ENV=production -e APP_ENV=production -e DB_HOST=devsecops-mysql -e DB_PORT=3306 -e DB_NAME="$DB_NAME" -e DB_USER="$DB_USER" -e DB_PASSWORD="$DB_PASSWORD" 850252650249.dkr.ecr.ap-south-1.amazonaws.com/devsecops-platform:latest
          echo "=== STEP 6: NGINX ==="
          echo ZXZlbnRzIHt9Cmh0dHAgewogICAgc2VydmVyIHsKICAgICAgICBsaXN0ZW4gODA7CiAgICAgICAgbG9jYXRpb24gLyB7CiAgICAgICAgICAgIHByb3h5X3Bhc3MgaHR0cDovL2RldnNlY29wcy1hcHA6NTAwMDsKICAgICAgICB9CiAgICB9Cn0K | base64 -d > /home/ec2-user/nginx.conf
          if ! docker ps --filter "name=devsecops-nginx" --filter "status=running" -q | grep -q .; then docker stop devsecops-nginx || true; docker rm devsecops-nginx || true; docker run -d --name devsecops-nginx --network devsecops-network --restart always -p 80:80 -v /home/ec2-user/nginx.conf:/etc/nginx/nginx.conf:ro nginx:alpine; fi
          echo "=== STEP 7: PROMETHEUS ==="
          echo Z2xvYmFsOgogIHNjcmFwZV9pbnRlcnZhbDogMTVzCgpzY3JhcGVfY29uZmlnczoKICAtIGpvYl9uYW1lOiAiZGV2c2Vjb3BzLWFwcCIKICAgIHN0YXRpY19jb25maWdzOgogICAgICAtIHRhcmdldHM6IFsiZGV2c2Vjb3BzLWFwcDo1MDAwIl0K | base64 -d > /home/ec2-user/prometheus.yml
          docker stop devsecops-prometheus || true
          docker rm devsecops-prometheus || true
          docker volume create devsecops-prometheus-data || true
          docker run -d --name devsecops-prometheus --network devsecops-network -p 9090:9090 -v /home/ec2-user/prometheus.yml:/etc/prometheus/prometheus.yml:ro -v devsecops-prometheus-data:/prometheus prom/prometheus:latest --config.file=/etc/prometheus/prometheus.yml
          echo "=== STEP 8: GRAFANA ==="
          mkdir -p /home/ec2-user/grafana/provisioning/datasources /home/ec2-user/grafana/provisioning/dashboards /home/ec2-user/grafana/dashboards
          echo YXBpVmVyc2lvbjogMQoKZGF0YXNvdXJjZXM6CiAgLSBuYW1lOiBQcm9tZXRoZXVzCiAgICB0eXBlOiBwcm9tZXRoZXVzCiAgICBhY2Nlc3M6IHByb3h5CiAgICB1cmw6IGh0dHA6Ly9kZXZzZWNvcHMtcHJvbWV0aGV1czo5MDkwCiAgICBpc0RlZmF1bHQ6IHRydWUKICAgIGVkaXRhYmxlOiB0cnVlCiAgICB1aWQ6IHByb21ldGhldXMK | base64 -d > /home/ec2-user/grafana/provisioning/datasources/datasource.yml
          echo  | base64 -d > /home/ec2-user/grafana/provisioning/dashboards/dashboard.yml
          echo __DASHBOARD_B64__ | base64 -d > /home/ec2-user/grafana/dashboards/devsecops-dashboard.json
          chmod -R 755 /home/ec2-user/grafana
          docker stop devsecops-grafana || true
          docker rm devsecops-grafana || true
          docker volume create devsecops-grafana-data || true
          docker run -d --name devsecops-grafana --network devsecops-network -p 3000:3000 -v devsecops-grafana-data:/var/lib/grafana -v /home/ec2-user/grafana/provisioning:/etc/grafana/provisioning:ro -v /home/ec2-user/grafana/dashboards:/var/lib/grafana/dashboards:ro grafana/grafana:latest
          echo "=== STEP 9: HEALTH CHECKS ==="
          sleep 15
          docker ps --filter name=devsecops- --format '{{.Names}}'
          HEALTH_OUTPUT=$(curl -sf http://localhost/health)
          echo "$HEALTH_OUTPUT"
          echo "$HEALTH_OUTPUT" | grep -q '"connected":true'
          echo "$HEALTH_OUTPUT" | grep -q '"mode":"live_mysql"'
          echo "$HEALTH_OUTPUT" | grep -q '"status":"healthy"'
          docker exec devsecops-prometheus wget -qO- http://localhost:9090/api/v1/targets | grep -E 'devsecops-app:5000'
          curl -f http://localhost:3000/api/health
          EOF
          
          DASHBOARD_BASE64=$(base64 -w 0 monitoring/grafana/dashboards/devsecops-dashboard.json)
          sed -i "s|__DASHBOARD_B64__|$DASHBOARD_BASE64|" raw-commands.sh
          
          # Run the script via SSM by passing it natively as a single string
          jq -R -s '{
            "InstanceIds": ["i-0fb9dcbeb35b4fdbe"],
            "DocumentName": "AWS-RunShellScript",
            "Parameters": {
              "commands": [.]
            }
          }' raw-commands.sh > ssm_input.json
          COMMAND_ID=$(aws ssm send-command \
            --cli-input-json file://ssm_input.json \
            --region ap-south-1 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          MAX_WAIT=120
          ELAPSED=0
          STATUS=""

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id $COMMAND_ID \
              --instance-id i-0fb9dcbeb35b4fdbe \
              --region ap-south-1 \
              --query "Status" \
              --output text)

            echo "SSM Execution Status (${ELAPSED}s): $STATUS"
            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              break
            fi
            sleep 5
            ELAPSED=$((ELAPSED + 5))
          done

          echo "Waiting for output to sync..."
          sleep 10

          RAW_JSON=$(aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id i-0fb9dcbeb35b4fdbe \
            --region ap-south-1 \
            --output json)

          echo "=== SSM Standard Output ==="
          echo "$RAW_JSON" | jq -r '.StandardOutputContent'

          STDERR=$(echo "$RAW_JSON" | jq -r '.StandardErrorContent // empty')
          if [ -n "$STDERR" ]; then
            echo "=== SSM Standard Error ==="
            echo "$STDERR"
          fi

          if [ "$STATUS" != "Success" ]; then
            echo "SSM command failed with status: $STATUS"
            exit 1
          fi

      - name: Application health check
        run: |
          set +e
          echo "Verifying production endpoint: http://13.232.174.161/health"
          max_attempts=12
          attempt=0
          healthy=false
          
          while [ $attempt -lt $max_attempts ]; do
            attempt=$((attempt + 1))
            resp=$(curl -s --max-time 10 http://13.232.174.161/health || echo '{"error": "curl failed"}')
            
            status=$(echo "$resp" | jq -r '.status // empty')
            db_connected=$(echo "$resp" | jq -r '.database.connected // empty')
            db_mode=$(echo "$resp" | jq -r '.database.mode // empty')
            
            echo "Attempt $attempt health status: $status, database connected: $db_connected, mode: $db_mode"
            
            if [ "$status" = "healthy" ] && [ "$db_connected" = "true" ] && [ "$db_mode" = "live_mysql" ]; then
              healthy=true
              echo "Production health check passed successfully!"
              break
            fi
            
            sleep 5
          done
          
          if [ "$healthy" != "true" ]; then
            echo "Production health check failed to confirm healthy status and live database connection."
            exit 1
          fi

          echo "Pipeline completed successfully!"
          exit 0






