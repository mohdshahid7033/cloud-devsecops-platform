name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: [self-hosted, Windows]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Python
        shell: powershell
        run: |
          python --version
          pip --version
          echo "C:\Program Files\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\trivy" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "$env:APPDATA\Python\Python314\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Users\MOHD SHAHID\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\sonar-scanner\sonar-scanner-7.0.2.4839-windows-x64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install -r app/requirements.txt
          python -m pip install pytest
          python -m pip install awscli
          $awsScript = "$env:APPDATA\Python\Python314\Scripts\aws"
          if (Test-Path $awsScript) {
            (Get-Content $awsScript) -replace '^#!.*python\.exe', '#!/usr/bin/env python' | Set-Content $awsScript
          }
          if (Test-Path "C:\Users\MOHD SHAHID\bin") {
            Copy-Item -Path "$env:APPDATA\Python\Python314\Scripts\aws*" -Destination "C:\Users\MOHD SHAHID\bin" -Force
          }

      - name: Run tests
        shell: powershell
        run: |
          $env:PYTHONPATH="."
          python -m pytest

      - name: SonarQube analysis
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://localhost:9000
        run: |
          $sonarVersion = "7.0.2.4839"
          $sonarDir = "C:\sonar-scanner\sonar-scanner-$sonarVersion-windows-x64"
          if (!(Test-Path "$sonarDir\bin\sonar-scanner.bat")) {
            $sonarDir = "$env:RUNNER_TEMP\sonar-scanner-$sonarVersion-windows-x64"
            if (!(Test-Path "$sonarDir\bin\sonar-scanner.bat")) {
              $zipPath = "$env:RUNNER_TEMP\sonar-scanner.zip"
              curl.exe -sSLo $zipPath "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-$sonarVersion-windows-x64.zip"
              Expand-Archive -Path $zipPath -DestinationPath "$env:RUNNER_TEMP" -Force
            }
          }
          $env:PATH = "$sonarDir\bin;$env:PATH"
          echo "$sonarDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          $token = $env:SONAR_TOKEN.Trim().Trim('"').Trim("'")
          $hasher = [System.Security.Cryptography.SHA384]::Create()
          $hashBytes = $hasher.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($token))
          $tokenHash = [System.BitConverter]::ToString($hashBytes).Replace('-', '').ToLowerInvariant()

          $code = curl.exe -s -o NUL -w "%{http_code}" -u "${token}:" http://localhost:9000/api/v2/analysis/version
          if ($code -ne "200") {
            Write-Host "Updating SonarQube token registration to match secret..."
            $sql = "UPDATE USER_TOKENS SET TOKEN_HASH = '$tokenHash' WHERE NAME = 'sonar-window-ci';"
            Set-Content -Path "update_token.sql" -Value $sql
            docker cp update_token.sql sonarqube:/tmp/update_token.sql
            docker exec -u 0 sonarqube /opt/java/openjdk/bin/java -cp /opt/sonarqube/lib/jdbc/h2/h2-2.3.232.jar org.h2.tools.RunScript -url "jdbc:h2:tcp://127.0.0.1:9092/sonar;USER=;PASSWORD=" -script /tmp/update_token.sql
            docker exec -u 0 sonarqube rm -f /tmp/update_token.sql
            Remove-Item -Path "update_token.sql" -Force
            $codeAfter = curl.exe -s -o NUL -w "%{http_code}" -u "${token}:" http://localhost:9000/api/v2/analysis/version
            Write-Host "Auth check after update: $codeAfter"
          }

          $env:SONAR_TOKEN = $token
          $env:SONAR_HOST_URL = "http://localhost:9000"
          & "$sonarDir\bin\sonar-scanner.bat" `
            -D"sonar.projectKey=cloud-devsecops-platform" `
            -D"sonar.sources=app" `
            -D"sonar.tests=tests" `
            -D"sonar.host.url=http://localhost:9000" `
            -D"sonar.token=$token"

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1
          trivyignores: .trivyignore
          skip-setup-trivy: true

      - name: Build Docker image
        shell: powershell
        run: |
          docker build -t devsecops-platform -f docker/Dockerfile .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-platform
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1
          trivyignores: .trivyignore
          skip-setup-trivy: true

      - name: Check AWS CLI
        shell: powershell
        run: |
          aws --version

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image to ECR
        shell: powershell
        run: |
          docker tag devsecops-platform:latest 850252650249.dkr.ecr.ap-south-1.amazonaws.com/devsecops-platform:latest
          docker push 850252650249.dkr.ecr.ap-south-1.amazonaws.com/devsecops-platform:latest

      - name: Deploy to EC2 via SSM
        shell: bash
        env:
          MSYS_NO_PATHCONV: 1
        run: |
          export PATH="$HOME/bin:$PATH"
          cat > ssm-commands.json <<'EOF'
          {
            "commands": [
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 850252650249.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 850252650249.dkr.ecr.ap-south-1.amazonaws.com/devsecops-platform:latest",
              "docker stop devsecops-app || true",
              "docker rm devsecops-app || true",
              "docker network create devsecops-network || true",
              "docker run -d --name devsecops-app --network devsecops-network 850252650249.dkr.ecr.ap-south-1.amazonaws.com/devsecops-platform:latest",
              "echo ZXZlbnRzIHt9Cmh0dHAgewogICAgc2VydmVyIHsKICAgICAgICBsaXN0ZW4gODA7CiAgICAgICAgbG9jYXRpb24gLyB7CiAgICAgICAgICAgIHByb3h5X3Bhc3MgaHR0cDovL2RldnNlY29wcy1hcHA6NTAwMDsKICAgICAgICB9CiAgICB9Cn0K | base64 -d > /home/ec2-user/nginx.conf",
              "docker stop devsecops-nginx || true",
              "docker rm devsecops-nginx || true",
              "docker run -d --name devsecops-nginx --network devsecops-network -p 80:80 -v /home/ec2-user/nginx.conf:/etc/nginx/nginx.conf:ro nginx:alpine",
              "echo Z2xvYmFsOgogIHNjcmFwZV9pbnRlcnZhbDogMTVzCgpzY3JhcGVfY29uZmlnczoKICAtIGpvYl9uYW1lOiAiZGV2c2Vjb3BzLWFwcCIKICAgIHN0YXRpY19jb25maWdzOgogICAgICAtIHRhcmdldHM6IFsiZGV2c2Vjb3BzLWFwcDo1MDAwIl0K | base64 -d > /home/ec2-user/prometheus.yml",
              "docker stop devsecops-prometheus || true",
              "docker rm devsecops-prometheus || true",
              "docker volume create devsecops-prometheus-data || true",
              "docker run -d --name devsecops-prometheus --network devsecops-network -p 9090:9090 -v /home/ec2-user/prometheus.yml:/etc/prometheus/prometheus.yml:ro -v devsecops-prometheus-data:/prometheus prom/prometheus:latest --config.file=/etc/prometheus/prometheus.yml",
              "mkdir -p /home/ec2-user/grafana/provisioning/datasources /home/ec2-user/grafana/provisioning/dashboards /home/ec2-user/grafana/dashboards",
              "echo YXBpVmVyc2lvbjogMQoKZGF0YXNvdXJjZXM6CiAgLSBuYW1lOiBQcm9tZXRoZXVzCiAgICB0eXBlOiBwcm9tZXRoZXVzCiAgICBhY2Nlc3M6IHByb3h5CiAgICB1cmw6IGh0dHA6Ly9kZXZzZWNvcHMtcHJvbWV0aGV1czo5MDkwCiAgICBpc0RlZmF1bHQ6IHRydWUKICAgIGVkaXRhYmxlOiB0cnVlCiAgICB1aWQ6IHByb21ldGhldXMK | base64 -d > /home/ec2-user/grafana/provisioning/datasources/datasource.yml",
              "echo  | base64 -d > /home/ec2-user/grafana/provisioning/dashboards/dashboard.yml",
              "echo  | base64 -d > /home/ec2-user/grafana/dashboards/devsecops-dashboard.json",
              "chmod -R 755 /home/ec2-user/grafana",
              "docker stop devsecops-grafana || true",
              "docker rm devsecops-grafana || true",
              "docker volume create devsecops-grafana-data || true",
              "docker run -d --name devsecops-grafana --network devsecops-network -p 3000:3000 -v devsecops-grafana-data:/var/lib/grafana -v /home/ec2-user/grafana/provisioning:/etc/grafana/provisioning:ro -v /home/ec2-user/grafana/dashboards:/var/lib/grafana/dashboards:ro grafana/grafana:latest",
              "sleep 15",
              "docker ps --filter name=devsecops- --format '{{.Names}}'",
              "curl -f http://localhost/health",
              "docker exec devsecops-prometheus wget -qO- http://localhost:9090/api/v1/targets | grep -E 'devsecops-app:5000'",
              "curl -f http://localhost:3000/api/health"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0fb9dcbeb35b4fdbe \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-commands.json \
            --region ap-south-1 \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          sleep 25

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0fb9dcbeb35b4fdbe \
            --region ap-south-1
