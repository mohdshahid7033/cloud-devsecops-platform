name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_to_production:
        description: 'Authorize Blue/Green deployment to production'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # Required for AWS OIDC authentication

# Prevent concurrent deployment runs from publishing conflicting images or executing overlapping cutovers
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'production-deploy' || github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. TEST AND SCAN (Validation-only, runs on PRs and main pushes)
  # ============================================================================
  test-and-scan:
    name: Test & Security Scan
    runs-on: ubuntu-latest
    services:
      sonarqube:
        image: sonarqube:community
        ports:
          - 9000:9000

    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check Python
        id: setup_python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        id: install_deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt
          python -m pip install pytest
          python -m pip install awscli

      - name: Run unit & integration tests
        id: run_tests
        env:
          PYTHONPATH: "."
        run: |
          python -m pytest tests/test_app.py tests/test_platform.py

      - name: Python dependency vulnerability scan (pip-audit)
        id: pip_audit
        run: |
          echo "=== Installing pinned pip-audit (v2.10.1) ==="
          python -m pip install pip-audit==2.10.1

          echo "=== Preparing temporary dependency audit manifest ==="
          TEMP_MANIFEST=".audit-requirements.tmp"
          trap 'rm -f "$TEMP_MANIFEST"' EXIT
          cat app/requirements.txt > "$TEMP_MANIFEST"
          echo "msgpack>=1.2.1" >> "$TEMP_MANIFEST"

          echo "=== Pass 1: Auditing runtime & Docker-retained dependencies on Python 3.12 (CI runner) ==="
          python -m pip_audit --timeout 30 -r "$TEMP_MANIFEST" --desc --format columns

          echo "=== Pass 2: Auditing runtime & Docker-retained dependencies on Python 3.14 (Docker container runtime) ==="
          docker run --rm -v "$(pwd):/app" -w /app python:3.14-alpine sh -c "
            pip install --no-cache-dir pip-audit==2.10.1 && \
            pip-audit --timeout 30 -r .audit-requirements.tmp --desc --format columns
          "

      - name: Set up Java
        id: setup_java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: SonarQube analysis
        id: sonarqube
        env:
          SONAR_HOST_URL: http://localhost:9000
        run: |
          echo "Java environment:"
          java -version

          echo "Waiting for SonarQube to start (max 300s)..."
          MAX_WAIT=300
          START_TIME=$(date +%s)
          READY=false
          while [ $(( $(date +%s) - START_TIME )) -lt $MAX_WAIT ]; do
            if curl -s --connect-timeout 5 --max-time 10 http://localhost:9000/api/system/status | grep -q '"status":"UP"'; then
              READY=true
              break
            fi
            sleep 5
          done

          if [ "$READY" != true ]; then
            echo "ERROR: SonarQube service failed to become ready within ${MAX_WAIT}s" >&2
            exit 1
          fi
          echo "SonarQube is up!"

          ADMIN_PASSWORD="EphemeralAdminPass_${RANDOM}_$(openssl rand -hex 8)"
          echo "::add-mask::$ADMIN_PASSWORD"

          curl -s --connect-timeout 5 --max-time 15 -u admin:admin -X POST "http://localhost:9000/api/users/change_password?login=admin&previousPassword=admin&password=${ADMIN_PASSWORD}"

          TOKEN=$(curl -s --connect-timeout 5 --max-time 15 -u "admin:${ADMIN_PASSWORD}" -X POST "http://localhost:9000/api/user_tokens/generate?name=ci-token-${RANDOM}" | jq -r .token)
          echo "::add-mask::$TOKEN"

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to generate SonarQube analysis token"
            exit 1
          fi

          export SONAR_SCANNER_VERSION=7.0.2.4839
          export SONAR_SCANNER_HOME=$HOME/.sonar/sonar-scanner-$SONAR_SCANNER_VERSION-linux-x64
          curl -sSLo sonar-scanner.zip --connect-timeout 10 --max-time 60 https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-$SONAR_SCANNER_VERSION-linux-x64.zip
          unzip -q sonar-scanner.zip -d $HOME/.sonar/
          export PATH=$SONAR_SCANNER_HOME/bin:$PATH

          sonar-scanner \
            -Dsonar.projectKey=cloud-devsecops-platform \
            -Dsonar.sources=app \
            -Dsonar.tests=tests \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.token="$TOKEN" \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

      - name: Run Trivy filesystem scan
        id: trivy_fs
        run: |
          echo "=== Installing pinned Trivy (v0.76.2) with fail-closed SHA256 checksum verification ==="
          TRIVY_VERSION="0.76.2"
          TARBALL="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          CHECKSUMS="trivy_${TRIVY_VERSION}_checksums.txt"

          curl -fsSLo "/tmp/$CHECKSUMS" -L --connect-timeout 10 --max-time 30 \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$CHECKSUMS"
          curl -fsSLo "/tmp/$TARBALL" -L --connect-timeout 10 --max-time 60 \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$TARBALL"

          if [ ! -s "/tmp/$CHECKSUMS" ]; then
            echo "ERROR: Downloaded checksum file ($CHECKSUMS) is missing or empty!" >&2
            exit 1
          fi

          if [ ! -s "/tmp/$TARBALL" ]; then
            echo "ERROR: Downloaded tarball ($TARBALL) is missing or empty!" >&2
            exit 1
          fi

          echo "=== Verifying Trivy binary checksum manifest (fail-closed) ==="
          MATCH_LINES=$(grep -E "^[a-fA-F0-9]{64}[[:space:]]+(\*)?${TARBALL}$" "/tmp/$CHECKSUMS" || true)

          if [ -z "$MATCH_LINES" ]; then
            echo "ERROR: No matching checksum entry found for $TARBALL in manifest!" >&2
            exit 1
          fi

          ENTRY_COUNT=$(printf '%s\n' "$MATCH_LINES" | wc -l)
          if [ "$ENTRY_COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly 1 checksum entry for $TARBALL in manifest, found $ENTRY_COUNT!" >&2
            exit 1
          fi

          EXPECTED_HASH=$(printf '%s\n' "$MATCH_LINES" | awk '{print $1}')
          EXPECTED_FILE=$(printf '%s\n' "$MATCH_LINES" | awk '{print $2}' | sed 's/^\*//')

          if ! echo "$EXPECTED_HASH" | grep -E -q '^[a-fA-F0-9]{64}$'; then
            echo "ERROR: Malformed SHA256 checksum in manifest entry: '$EXPECTED_HASH'!" >&2
            exit 1
          fi

          if [ "$EXPECTED_FILE" != "$TARBALL" ]; then
            echo "ERROR: Checksum manifest filename mismatch! Expected: '$TARBALL', found: '$EXPECTED_FILE'" >&2
            exit 1
          fi

          printf '%s  %s\n' "$EXPECTED_HASH" "$TARBALL" > /tmp/expected_checksum.txt
          if ! (cd /tmp && sha256sum --check --strict expected_checksum.txt); then
            echo "ERROR: SHA256 checksum verification failed for $TARBALL!" >&2
            exit 1
          fi

          echo "=== Extracting Trivy binary ==="
          sudo tar -xzf "/tmp/$TARBALL" -C /usr/local/bin trivy
          rm -f "/tmp/$TARBALL" "/tmp/$CHECKSUMS" /tmp/expected_checksum.txt
          sudo chmod +x /usr/local/bin/trivy

          if [ ! -x /usr/local/bin/trivy ]; then
            echo "ERROR: Trivy binary was not installed or is not executable!" >&2
            exit 1
          fi

          INSTALLED_VER=$(trivy --version | head -n1 | grep -E -o '[0-9]+\.[0-9]+\.[0-9]+' || true)
          echo "Installed Trivy version: $INSTALLED_VER"
          if [ "$INSTALLED_VER" != "$TRIVY_VERSION" ]; then
            echo "ERROR: Installed Trivy version ($INSTALLED_VER) does not match expected version ($TRIVY_VERSION)!" >&2
            exit 1
          fi

          echo "=== Running Trivy filesystem scan ==="
          trivy fs --format json --output trivy-fs-results.json .
          trivy fs --format sarif --output trivy-fs.sarif .
          trivy fs --format table --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL .

          FS_CRIT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-fs-results.json 2>/dev/null || echo 0)
          FS_HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-fs-results.json 2>/dev/null || echo 0)
          FS_MED=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' trivy-fs-results.json 2>/dev/null || echo 0)
          FS_LOW=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="LOW")] | length' trivy-fs-results.json 2>/dev/null || echo 0)

          echo "### Trivy Filesystem Scan Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Severity | Findings |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| CRITICAL | $FS_CRIT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| HIGH | $FS_HIGH |" >> "$GITHUB_STEP_SUMMARY"
          echo "| MEDIUM | $FS_MED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| LOW | $FS_LOW |" >> "$GITHUB_STEP_SUMMARY"

          trivy fs --severity HIGH,CRITICAL --exit-code 1 .

      - name: Build Docker image for security scan
        id: build_docker
        run: |
          echo "=== Building Docker container image (single build) ==="
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          docker build \
            --build-arg BUILD_REVISION="${{ github.sha }}" \
            --build-arg BUILD_DATE="$BUILD_DATE" \
            -t "devsecops-platform:${{ github.sha }}" \
            -t devsecops-platform:latest \
            -f docker/Dockerfile .

          IMAGE_ID=$(docker inspect --format='{{.Id}}' "devsecops-platform:${{ github.sha }}")
          echo "Built Docker Image ID: $IMAGE_ID"
          echo "image_id=$IMAGE_ID" >> "$GITHUB_OUTPUT"

      - name: Container image smoke test
        id: smoke_test
        env:
          EXPECTED_IMAGE_ID: ${{ steps.build_docker.outputs.image_id }}
        run: |
          echo "=== Running container image smoke test ==="
          CURRENT_ID=$(docker inspect --format='{{.Id}}' "devsecops-platform:${{ github.sha }}")
          if [ -n "$EXPECTED_IMAGE_ID" ] && [ "$CURRENT_ID" != "$EXPECTED_IMAGE_ID" ]; then
            echo "ERROR: Image ID mismatch before smoke test! Expected $EXPECTED_IMAGE_ID, found $CURRENT_ID" >&2
            exit 1
          fi

          SMOKE_CONTAINER="smoke-test-app-${RANDOM}"
          trap 'docker rm -f "$SMOKE_CONTAINER" >/dev/null 2>&1 || true' EXIT

          docker run -d --name "$SMOKE_CONTAINER" -p 5000:5000 "devsecops-platform:${{ github.sha }}"

          MAX_WAIT=30
          START_TIME=$(date +%s)
          SMOKE_PASSED=false

          while [ $(( $(date +%s) - START_TIME )) -lt $MAX_WAIT ]; do
            RESP=$(curl -s --connect-timeout 2 --max-time 5 http://localhost:5000/health || echo "")
            if echo "$RESP" | grep -q '"status"[[:space:]]*:[[:space:]]*"healthy"'; then
              SMOKE_PASSED=true
              echo "Smoke test passed: container started and responded with healthy status on /health!"
              break
            fi
            sleep 2
          done

          if [ "$SMOKE_PASSED" != "true" ]; then
            echo "ERROR: Container smoke test failed to become healthy within ${MAX_WAIT}s" >&2
            docker logs "$SMOKE_CONTAINER" || true
            exit 1
          fi

          docker rm -f "$SMOKE_CONTAINER" >/dev/null 2>&1 || true
          trap - EXIT

      - name: Scan Docker image with Trivy
        id: trivy_image
        env:
          EXPECTED_IMAGE_ID: ${{ steps.build_docker.outputs.image_id }}
        run: |
          echo "=== Scanning verified Docker image with Trivy ==="
          SCAN_IMAGE_ID=$(docker inspect --format='{{.Id}}' "devsecops-platform:${{ github.sha }}")
          echo "Scanning Docker Image ID: $SCAN_IMAGE_ID"

          if [ -n "$EXPECTED_IMAGE_ID" ] && [ "$SCAN_IMAGE_ID" != "$EXPECTED_IMAGE_ID" ]; then
            echo "ERROR: Image ID mismatch before security scan! Expected $EXPECTED_IMAGE_ID, found $SCAN_IMAGE_ID" >&2
            exit 1
          fi

          trivy image --format json --output trivy-image-results.json "devsecops-platform:${{ github.sha }}"
          trivy image --format sarif --output trivy-image.sarif "devsecops-platform:${{ github.sha }}"
          trivy image --format table --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL "devsecops-platform:${{ github.sha }}"

          echo "=== Generating CycloneDX SBOM ==="
          trivy image --format cyclonedx --output sbom.json "devsecops-platform:${{ github.sha }}"

          if [ ! -s sbom.json ]; then
            echo "ERROR: Generated SBOM is empty!" >&2
            exit 1
          fi
          if ! jq -e '.bomFormat == "CycloneDX"' sbom.json >/dev/null; then
            echo "ERROR: Generated SBOM is not valid CycloneDX JSON!" >&2
            exit 1
          fi
          echo "CycloneDX SBOM generated and verified successfully."

          IMG_CRIT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-image-results.json 2>/dev/null || echo 0)
          IMG_HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-image-results.json 2>/dev/null || echo 0)
          IMG_MED=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' trivy-image-results.json 2>/dev/null || echo 0)
          IMG_LOW=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="LOW")] | length' trivy-image-results.json 2>/dev/null || echo 0)

          echo "### Trivy Container Image Scan Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Severity | Findings |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| CRITICAL | $IMG_CRIT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| HIGH | $IMG_HIGH |" >> "$GITHUB_STEP_SUMMARY"
          echo "| MEDIUM | $IMG_MED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| LOW | $IMG_LOW |" >> "$GITHUB_STEP_SUMMARY"

          trivy image --severity HIGH,CRITICAL --exit-code 1 "devsecops-platform:${{ github.sha }}"

      - name: Upload security scan evidence and SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-evidence-${{ github.sha }}
          path: |
            trivy-fs-results.json
            trivy-fs.sarif
            trivy-image-results.json
            trivy-image.sarif
            sbom.json
          retention-days: 14
          if-no-files-found: error

      - name: Archive verified Docker image for publication
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_to_production == true
        env:
          EXPECTED_IMAGE_ID: ${{ steps.build_docker.outputs.image_id }}
        run: |
          echo "=== Archiving verified Docker image for publication ==="
          ARCHIVE_ID=$(docker inspect --format='{{.Id}}' "devsecops-platform:${{ github.sha }}")
          if [ -n "$EXPECTED_IMAGE_ID" ] && [ "$ARCHIVE_ID" != "$EXPECTED_IMAGE_ID" ]; then
            echo "ERROR: Image ID mismatch before archiving! Expected $EXPECTED_IMAGE_ID, found $ARCHIVE_ID" >&2
            exit 1
          fi

          mkdir -p /tmp/image-artifact
          docker save "devsecops-platform:${{ github.sha }}" -o /tmp/image-artifact/devsecops-platform-image.tar
          cat << EOF > /tmp/image-artifact/image-metadata.json
          {
            "commit_sha": "${{ github.sha }}",
            "image_id": "$ARCHIVE_ID",
            "image_tag": "devsecops-platform:${{ github.sha }}",
            "created_at": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF

      - name: Upload verified Docker image artifact
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_to_production == true
        uses: actions/upload-artifact@v4
        with:
          name: verified-docker-image-${{ github.sha }}
          path: /tmp/image-artifact/
          retention-days: 1
          if-no-files-found: error

  # ============================================================================
  # 2. PUBLISH ECR (Runs only on manual workflow_dispatch on main with deploy_to_production: true)
  # ============================================================================
  publish-ecr:
    name: Build & Publish ECR
    runs-on: ubuntu-latest
    needs: [test-and-scan]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_to_production == true
    outputs:
      image_digest: ${{ steps.push_image.outputs.image_digest }}
      image_uri: ${{ steps.push_image.outputs.image_uri }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Disable containerd image store for Docker
        run: |
          echo '{"features": {"containerd-snapshotter": false}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Download verified Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: verified-docker-image-${{ github.sha }}
          path: /tmp/image-artifact

      - name: Load and verify Docker image
        id: load_image
        run: |
          echo "=== Loading verified Docker image ==="
          if [ ! -f /tmp/image-artifact/devsecops-platform-image.tar ]; then
            echo "ERROR: Verified image artifact not found!" >&2
            exit 1
          fi

          LOAD_OUTPUT=$(docker load -i /tmp/image-artifact/devsecops-platform-image.tar)
          echo "$LOAD_OUTPUT"

          RECORDED_ID=$(jq -r .image_id /tmp/image-artifact/image-metadata.json 2>/dev/null || true)
          LOADED_ID=$(docker inspect --format='{{.Id}}' "devsecops-platform:${{ github.sha }}")

          echo "Recorded Image ID: $RECORDED_ID"
          echo "Loaded Image ID:   $LOADED_ID"

          if [ -n "$RECORDED_ID" ] && [ "$LOADED_ID" != "$RECORDED_ID" ]; then
            echo "ERROR: Loaded image ID does not match recorded image ID from test-and-scan!" >&2
            exit 1
          fi
          echo "Docker image ID verified successfully: $LOADED_ID"

      - name: Configure AWS credentials (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build, tag, and push image to ECR
        id: push_image
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID || '850252650249' }}.dkr.ecr.ap-south-1.amazonaws.com
          ECR_REPOSITORY: devsecops-platform
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "=== Tagging loaded verified image for ECR ==="
          docker tag "devsecops-platform:${IMAGE_TAG}" "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker tag "devsecops-platform:${IMAGE_TAG}" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          echo "=== Pushing image to ECR ==="
          PUSH_OUTPUT=$(docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG")
          echo "$PUSH_OUTPUT"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          echo "=== Querying authoritative ECR registry digest for tag $IMAGE_TAG ==="
          DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text \
            --region ap-south-1 2>/dev/null || true)

          if [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then
            DIGEST=$(echo "$PUSH_OUTPUT" | grep -E -o 'sha256:[a-f0-9]{64}' | head -n1 || true)
          fi

          if [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then
            DIGEST=$(docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" 2>/dev/null | grep "^$ECR_REGISTRY/$ECR_REPOSITORY@sha256:" | cut -d@ -f2 | head -n1 || true)
          fi

          echo "Captured Authoritative ECR Digest: $DIGEST"

          if ! echo "$DIGEST" | grep -E -q '^sha256:[a-f0-9]{64}$'; then
            echo "ERROR: Failed to capture valid SHA256 image digest from ECR for tag '$IMAGE_TAG'! Captured: '$DIGEST'" >&2
            exit 1
          fi

          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY@$DIGEST"
          echo "Validated Immutable Image URI: $IMAGE_URI"

          echo "image_digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

  # ============================================================================
  # 3. DEPLOY BLUE/GREEN (Safe traffic switch via SSM on target EC2 instance)
  # ============================================================================
  deploy-blue-green:
    name: Blue/Green Deployment
    runs-on: ubuntu-latest
    needs: [publish-ecr]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_to_production == true

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure AWS credentials (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Resolve target EC2 instance by tags
        id: resolve_ec2
        run: |
          echo "Resolving running EC2 instance with tags Project=devsecops-platform, Environment=production..."
          INSTANCES=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=devsecops-platform" \
                      "Name=tag:Environment,Values=production" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text \
            --region ap-south-1)

          NUM_INSTANCES=$(echo "$INSTANCES" | wc -w)
          if [ "$NUM_INSTANCES" -ne 1 ]; then
            echo "ERROR: Expected exactly 1 running instance, found $NUM_INSTANCES ($INSTANCES). Aborting deployment for safety." >&2
            exit 1
          fi

          INSTANCE_ID=$(echo "$INSTANCES" | tr -d '[:space:]')
          echo "Resolved unique target EC2 Instance ID: $INSTANCE_ID"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Execute Blue/Green deployment via SSM
        id: ssm_deploy
        env:
          TARGET_INSTANCE_ID: ${{ steps.resolve_ec2.outputs.instance_id }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID || '850252650249' }}
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_DIGEST: ${{ needs.publish-ecr.outputs.image_digest }}
          IMAGE_URI: ${{ needs.publish-ecr.outputs.image_uri }}
        run: |
          DEPLOY_IMAGE="${IMAGE_URI:-${AWS_ACCOUNT_ID}.dkr.ecr.ap-south-1.amazonaws.com/devsecops-platform@${IMAGE_DIGEST}}"
          if ! echo "$DEPLOY_IMAGE" | grep -q '@sha256:'; then
            echo "ERROR: DEPLOY_IMAGE must reference an immutable digest (@sha256:...), found '$DEPLOY_IMAGE'" >&2
            exit 1
          fi
          echo "Deploying verified immutable container image: $DEPLOY_IMAGE"
          DEPLOY_SCRIPT_GZ_B64=$(gzip -9c scripts/deploy_blue_green.sh | base64 -w 0)
          DASHBOARD_GZ_B64=$(gzip -9c monitoring/grafana/dashboards/devsecops-dashboard.json | base64 -w 0)

          cat << 'EOF' > remote_wrapper.sh
          #!/bin/bash
