                  if docker exec devsecops-nginx test -s /etc/nginx/conf.d/upstream.conf 2>/dev/null; then
                      if [ ! -s /home/ec2-user/nginx-conf/backup/upstream.conf.orig ]; then
                          BACKUP_VALID=false
