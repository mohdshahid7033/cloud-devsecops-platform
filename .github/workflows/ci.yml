                  HOST_MD5=$(md5sum /home/ec2-user/nginx-conf/upstream.conf 2>/dev/null | awk '{print $1}')
                  CONT_MD5=$(docker exec devsecops-nginx md5sum /etc/nginx/conf.d/upstream.conf 2>/dev/null | awk '{print $1}')
                  if [ -n "$HOST_MD5" ] && [ "$HOST_MD5" = "$CONT_MD5" ]; then
                      CONFIGS_CONSISTENT=true
                  fi
              fi

              # Verify that nginx.conf on host has narrowed include and matches running container
              if [ "$NGINX_MOUNTS_VALID" = true ] && [ -s /home/ec2-user/nginx-conf/nginx.conf ]; then
                  if grep -q 'include /etc/nginx/conf.d/upstream.conf;' /home/ec2-user/nginx-conf/nginx.conf 2>/dev/null && \
