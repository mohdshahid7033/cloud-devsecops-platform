          DB_USER=$(aws ssm get-parameter --name "/devsecops/db_user" --query "Parameter.Value" --output text --region ap-south-1)
          DB_PASSWORD=$(aws ssm get-parameter --name "/devsecops/db_password" --with-decryption --query "Parameter.Value" --output text --region ap-south-1)
          DB_ROOT_PASSWORD=$(aws ssm get-parameter --name "/devsecops/db_root_password" --with-decryption --query "Parameter.Value" --output text --region ap-south-1)

