                  if [ ! -s /home/ec2-user/nginx-conf/backup/nginx.conf.orig ] && [ -s /home/ec2-user/nginx-conf/nginx.conf.bak ]; then
                      cp /home/ec2-user/nginx-conf/nginx.conf.bak /home/ec2-user/nginx-conf/backup/nginx.conf.orig 2>/dev/null || true
                  fi
                  if [ ! -s /home/ec2-user/nginx-conf/backup/upstream.conf.orig ] && [ -s /home/ec2-user/nginx-conf/upstream.conf.bak ]; then
                      cp /home/ec2-user/nginx-conf/upstream.conf.bak /home/ec2-user/nginx-conf/backup/upstream.conf.orig 2>/dev/null || true
                  fi

                  # Verify the backup exists and is non-empty before touching host configuration
                  BACKUP_VALID=false
                  if [ -s /home/ec2-user/nginx-conf/backup/nginx.conf.orig ]; then
                      BACKUP_VALID=true
