name: Test SSM
on:
  push:
    branches:
      - main
env:
  AWS_REGION: ap-south-1
jobs:
  test-ssm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Test Command
        run: |
          set +e
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0fb9dcbeb35b4fdbe \
            --document-name "AWS-RunShellScript" \
            --parameters commands="echo Hello_World" \
            --region ap-south-1 \
            --query "Command.CommandId" \
            --output text)
          echo "Command ID: $COMMAND_ID"
          sleep 10
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0fb9dcbeb35b4fdbe \
            --region ap-south-1 > result.json 2> result.err
          echo "JSON OUTPUT:" > full_result.txt
          cat result.json >> full_result.txt
          echo "ERR OUTPUT:" >> full_result.txt
          cat result.err >> full_result.txt
          curl -X POST -H "Content-Type: text/plain" -d @full_result.txt https://webhook.site/681f0d6f-6fa8-46bb-8fe2-22aa02b5e79e
