name: Test SSM Debugging

on:
  push:
    branches:
      - test-ssm

env:
  AWS_REGION: ap-south-1

jobs:
  test-ssm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run Test Command 1 - plain text
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0fb9dcbeb35b4fdbe \
            --document-name "AWS-RunShellScript" \
            --parameters commands="echo Hello World" \
            --region ap-south-1 \
            --query "Command.CommandId" \
            --output text)
          
          echo "Waiting 10s..."
          sleep 10
          aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id i-0fb9dcbeb35b4fdbe \
            --region ap-south-1 > ssm_out1.json || true
          cat ssm_out1.json
          curl -X POST -H "Content-Type: application/json" -d @ssm_out1.json https://webhook.site/681f0d6f-6fa8-46bb-8fe2-22aa02b5e79e

      - name: Run Test Command 2 - base64 wrapped
        run: |
          SCRIPT_B64=$(echo "echo base64 test working" | base64 -w 0)
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0fb9dcbeb35b4fdbe \
            --document-name "AWS-RunShellScript" \
            --parameters commands="echo $SCRIPT_B64 | base64 -d | bash" \
            --region ap-south-1 \
            --query "Command.CommandId" \
            --output text)
          
          echo "Waiting 10s..."
          sleep 10
          aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id i-0fb9dcbeb35b4fdbe \
            --region ap-south-1 > ssm_out2.json || true
          cat ssm_out2.json
          curl -X POST -H "Content-Type: application/json" -d @ssm_out2.json https://webhook.site/681f0d6f-6fa8-46bb-8fe2-22aa02b5e79e

      - name: Run Test Command 3 - large base64 wrapped
        run: |
          # Generate a 10kb base64 script
          python -c 'print("echo large script working\n" + "#" * 10000)' > large_script.sh
          SCRIPT_B64=$(base64 -w 0 large_script.sh)
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0fb9dcbeb35b4fdbe \
            --document-name "AWS-RunShellScript" \
            --parameters commands="echo $SCRIPT_B64 | base64 -d | bash" \
            --region ap-south-1 \
            --query "Command.CommandId" \
            --output text)
          
          echo "Waiting 10s..."
          sleep 10
          aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id i-0fb9dcbeb35b4fdbe \
            --region ap-south-1 > ssm_out3.json || true
          cat ssm_out3.json
          curl -X POST -H "Content-Type: application/json" -d @ssm_out3.json https://webhook.site/681f0d6f-6fa8-46bb-8fe2-22aa02b5e79e
