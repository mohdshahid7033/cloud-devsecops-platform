name: Test SSM Debugging

on:
  push:
    branches:
      - test-ssm

env:
  AWS_REGION: ap-south-1

jobs:
  test-ssm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Apply
        run: |
          cd terraform
          terraform init
          terraform apply -replace="aws_instance.devsecops_ec2" -auto-approve > tf_out.txt 2>&1 || true
          curl -X POST -H "Content-Type: text/plain" --data-binary @tf_out.txt https://webhook.site/681f0d6f-6fa8-46bb-8fe2-22aa02b5e79e
