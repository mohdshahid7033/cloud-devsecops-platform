name: Test SSM
on:
  push:
    branches:
      - main
env:
  AWS_REGION: ap-south-1
jobs:
  test-ssm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Test Command
        run: |
          set +e
          TS=$(date +%s)
          mkdir -p iam_output
          
          # Force LF for the script
          cat << 'EOF' > test-script.sh
          #!/bin/bash
          echo "Hello World from properly formatted JSON" > /tmp/hello-test.txt
          EOF
          
          sed -i 's/\r$//' test-script.sh
          
          jq -R -s '{
            "InstanceIds": ["i-0fb9dcbeb35b4fdbe"],
            "DocumentName": "AWS-RunShellScript",
            "Parameters": {
              "commands": [.]
            }
          }' test-script.sh > ssm_input.json
          
          CMD_ID=$(aws ssm send-command \
            --cli-input-json file://ssm_input.json \
            --region ap-south-1 \
            --query "Command.CommandId" \
            --output text)
            
          sleep 15
          
          aws ssm get-command-invocation \
            --instance-id i-0fb9dcbeb35b4fdbe \
            --command-id $CMD_ID \
            --region ap-south-1 \
            > iam_output/proper-$TS.json 2>&1
          
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add iam_output/
          git commit -m "Test dos2unix and single string $TS" || true
          sleep 10
          git pull --rebase origin main
          git push origin main
