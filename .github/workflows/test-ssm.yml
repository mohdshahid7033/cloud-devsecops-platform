name: Test SSM Debugging

on:
  push:
    branches:
      - test-ssm

env:
  AWS_REGION: ap-south-1

jobs:
  test-ssm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install SSM Plugin
        run: |
          curl "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o "session-manager-plugin.deb"
          sudo dpkg -i session-manager-plugin.deb
          
      - name: Test Start Session
        run: |
          aws ssm start-session --target i-0fb9dcbeb35b4fdbe --document-name AWS-StartInteractiveCommand --parameters command="df -h" > session_out.txt 2>&1 || true
          cat session_out.txt
          curl -X POST -H "Content-Type: text/plain" --data-binary @session_out.txt https://webhook.site/681f0d6f-6fa8-46bb-8fe2-22aa02b5e79e
