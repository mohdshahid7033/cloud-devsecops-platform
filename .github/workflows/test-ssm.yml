name: Test SSM
on:
  push:
    branches:
      - main
env:
  AWS_REGION: ap-south-1
jobs:
  test-ssm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Test Command
        run: |
          set +e
          TS=$(date +%s)
          mkdir -p iam_output
          
          curl -sL https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb -o "session-manager-plugin.deb"
          sudo dpkg -i session-manager-plugin.deb
          
          aws ssm start-session \
            --target i-0fb9dcbeb35b4fdbe \
            --document-name AWS-StartInteractiveCommand \
            --parameters command="ls -l" \
            > iam_output/session-$TS.txt 2>&1
          
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add iam_output/
          git commit -m "Test session $TS" || true
          sleep 10
          git pull --rebase origin main
          git push origin main
