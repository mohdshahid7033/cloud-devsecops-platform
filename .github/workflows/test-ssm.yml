name: Test SSM
on:
  push:
    branches:
      - main
env:
  AWS_REGION: ap-south-1
jobs:
  test-ssm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Test Command
        run: |
          set +e
          TS=$(date +%s)
          mkdir -p iam_output
          
          curl -v --max-time 10 http://13.232.174.161/health > iam_output/health-$TS.txt 2>&1
          
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add iam_output/
          git commit -m "Test health $TS" || true
          sleep 10
          git pull --rebase origin main
          git push origin main
